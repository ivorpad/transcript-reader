<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcript Reader</title>
    <script>
      (function () {
        var dark = false;
        try {
          var stored = JSON.parse(
            localStorage.getItem('transcript-reader-settings') || 'null'
          );
          var mode = stored && stored.theme ? stored.theme : 'system';
          dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (error) {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (mediaError) {
            /* ignore */
          }
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="./src/reader/reader-app.ts"></script>
  </head>
  <body>
    <transcript-reader></transcript-reader>
  </body>
</html>
